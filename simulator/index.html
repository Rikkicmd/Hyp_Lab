<title>HVLAB Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: three-pane operator console. Runbook (left) · PowerShell console (center) · live environment views (right). Stacks on phones. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f6f8fb; --line:#d6dce5; --fg:#16202d; --muted:#5b6778;
  --accent:#0b62c4; --accent-soft:#e3eefb; --ok:#13804b; --ok-soft:#e1f4ea; --warn:#a15c00; --warn-soft:#fdf0d9;
  --bad:#b42318; --bad-soft:#fde7e5; --idle:#8a96a8;
  --term-bg:#0f1722; --term-fg:#d7e1ee; --term-dim:#7f8da1; --term-err:#ff8a80; --term-warn:#ffd479; --term-ok:#7ee2a8; --term-acc:#7cc4ff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1119; --panel:#121a25; --panel-2:#17212e; --line:#263345; --fg:#e4ebf4; --muted:#93a1b5;
  --accent:#5aa9ff; --accent-soft:#16304d; --ok:#4cc98a; --ok-soft:#123224; --warn:#f0b44c; --warn-soft:#3a2a10;
  --bad:#ff7b72; --bad-soft:#3d1715; --idle:#6b7a8f; --term-bg:#070c13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1119; --panel:#121a25; --panel-2:#17212e; --line:#263345; --fg:#e4ebf4; --muted:#93a1b5;
  --accent:#5aa9ff; --accent-soft:#16304d; --ok:#4cc98a; --ok-soft:#123224; --warn:#f0b44c; --warn-soft:#3a2a10;
  --bad:#ff7b72; --bad-soft:#3d1715; --idle:#6b7a8f; --term-bg:#070c13; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;margin:0}
.app{display:flex;flex-direction:column;height:100%;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:10px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:18px;margin:0;letter-spacing:.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.prog{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.prog b{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:330px minmax(0,1fr) 360px;gap:10px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pane h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.scroll{overflow:auto;min-height:0;flex:1}
/* runbook */
.phase{border-bottom:1px solid var(--line)}
.phase>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center}
.phase>summary::-webkit-details-marker{display:none}
.ph-num{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:22px}
.ph-title{flex:1;font-weight:600;font-size:13.5px}
.ph-count{font-size:11.5px;font-variant-numeric:tabular-nums;border-radius:99px;padding:1px 8px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.ph-count.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.task{display:flex;gap:9px;align-items:flex-start;padding:7px 14px 7px 46px;cursor:pointer;font-size:13px;line-height:1.35}
.task:hover{background:var(--panel-2)}
.task.sel{background:var(--accent-soft)}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--idle);margin-top:2px;box-sizing:border-box}
.task.ok .dot{background:var(--ok);border-color:var(--ok)}
.detail{padding:12px 14px;border-top:1px solid var(--line);background:var(--panel-2);font-size:13px;line-height:1.5;max-height:46%;overflow:auto;flex:none}
.detail h3{font-size:14px;margin:0 0 6px}
.detail p{margin:0 0 8px}
.detail .on{font-size:11.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.detail details{margin-top:6px}
.detail summary{cursor:pointer;font-weight:600;font-size:12.5px;color:var(--accent)}
.sol{margin:8px 0 0;display:flex;flex-direction:column;gap:5px}
.sol code{display:block;font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 7px;white-space:pre-wrap;word-break:break-all;cursor:pointer}
.sol code:hover{border-color:var(--accent)}
.sol .ctx{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* console */
.term{background:var(--term-bg);color:var(--term-fg);font-family:var(--mono);font-size:12.8px;line-height:1.45;border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--line)}
.term-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #223047;color:var(--term-dim);font-size:12px}
.term-top .where{color:var(--term-acc);font-weight:600}
.term-top .sp{flex:1}
.term-top button{background:transparent;border-color:#2a3a52;color:var(--term-dim);padding:3px 9px;font-size:12px}
.out{flex:1;overflow:auto;padding:10px 12px;white-space:pre-wrap;word-break:break-word;min-height:0}
.out .e{color:var(--term-err)} .out .w{color:var(--term-warn)} .out .k{color:var(--term-ok)} .out .d{color:var(--term-dim)} .out .a{color:var(--term-acc)}
.out .cmd{color:#fff}
.inrow{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid #223047}
.prompt{color:var(--term-acc);white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
#cmd{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;outline:none}
.busy{color:var(--term-warn)}
/* right */
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-radius:0;background:transparent;padding:10px 12px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.view{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card h4{margin:0;font-size:12.5px;padding:8px 10px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.card h4 small{font-weight:400;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t td,table.t th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
table.t tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.mono{font-family:var(--mono);font-size:11.5px}
.empty{color:var(--muted);font-size:12.5px;padding:10px}
.ev{font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.ev .src{font-family:var(--mono);font-size:11px;color:var(--muted)}
svg text{font-family:var(--sans)}
.topo{width:100%;height:auto}
/* incidents */
.inc{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.inc b{font-size:13px}
.inc .tk{font-family:var(--mono);font-size:11px;color:var(--muted)}
.inc.active{border-color:var(--warn);background:var(--warn-soft)}
.inc.solved{border-color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px}
@media (max-width:1180px){.grid{grid-template-columns:300px minmax(0,1fr)} .right{grid-column:1 / -1;min-height:420px}}
@media (max-width:760px){.app{height:auto}.grid{display:flex;flex-direction:column}.term{height:70vh}.left{max-height:none}.right{min-height:0}.detail{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand"><h1>HVLAB Simulator</h1><span>Hyper-V deployment, cluster and DR practice in your browser</span></div>
    <div class="prog"><div class="bar" aria-hidden="true"><i id="pbar"></i></div><b id="ptext">0 / 0 tasks</b></div>
    <div class="row" style="margin:0">
      <button id="fastBtn" class="ghost" aria-pressed="false" title="Speeds up boots and installs">Fast mode: off</button>
      <span id="resetWrap"><button id="resetBtn" class="ghost danger">Reset lab</button></span>
    </div>
  </header>

  <div class="grid">
    <section class="pane left" aria-label="Deployment runbook">
      <h2>Deployment runbook <span id="phaseNote" style="text-transform:none;letter-spacing:0;font-weight:500"></span></h2>
      <div class="scroll" id="runbook"></div>
      <div class="detail" id="detail"></div>
    </section>

    <section class="term" aria-label="PowerShell console">
      <div class="term-top"><span>Windows PowerShell</span><span class="where" id="where">LAB-HOST</span><span class="sp"></span><span id="busy" class="busy" hidden>running…</span><button id="clearBtn">Clear</button></div>
      <div class="out" id="out" role="log" aria-live="polite"></div>
      <form class="inrow" id="form" autocomplete="off"><span class="prompt" id="prompt">PS C:\&gt;</span><input id="cmd" aria-label="PowerShell command" spellcheck="false" placeholder="Type a command, or click one in the runbook. Try: help"></form>
    </section>

    <section class="pane right" aria-label="Environment">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="inv" aria-selected="true">Hyper-V</button>
        <button role="tab" data-tab="clu" aria-selected="false">Cluster</button>
        <button role="tab" data-tab="net" aria-selected="false">Topology</button>
        <button role="tab" data-tab="inc" aria-selected="false">Incidents</button>
        <button role="tab" data-tab="evt" aria-selected="false">Events</button>
      </div>
      <div class="scroll"><div class="view" id="view"></div></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ============================================================
   Constants describing the lab design
   ============================================================ */
const DOMAIN='hvlab.internal', DCIP='10.10.0.10', HOST='LAB-HOST';
const GOLDEN={'C:\\Images\\WS2025-Core.vhdx':'Windows Server 2025 Datacenter (Server Core)','C:\\Images\\WS2025-Desktop.vhdx':'Windows Server 2025 Datacenter (Desktop Experience)'};
const ROLE_OF={'HVLAB-Mgmt':'Mgmt','HVLAB-Storage':'Storage','HVLAB-Cluster':'Cluster'};
const PLAN={DC01:{Mgmt:'10.10.0.10'},STOR01:{Mgmt:'10.10.0.30',Storage:'10.10.20.30'},
  HV01:{Mgmt:'10.10.0.11',Storage:'10.10.20.11',Cluster:'10.10.30.11'},HV02:{Mgmt:'10.10.0.12',Storage:'10.10.20.12',Cluster:'10.10.30.12'},HV03:{Mgmt:'10.10.0.13'},
  MGMT01:{Mgmt:'10.10.0.20'}};
const GB=1073741824, MB=1048576;
const HOST_RAM=64*GB, HOST_RESERVE=4*GB;
const FEATURES={'Hyper-V':'Hyper-V','Failover-Clustering':'Failover Clustering','Multipath-IO':'Multipath I/O','AD-Domain-Services':'Active Directory Domain Services','DNS':'DNS Server','DHCP':'DHCP Server','FS-iSCSITarget-Server':'iSCSI Target Server','Windows-Server-Backup':'Windows Server Backup','RSAT-Clustering-PowerShell':'Failover Cluster Module for Windows PowerShell','Hyper-V-PowerShell':'Hyper-V Module for Windows PowerShell'};
const RESTART_FEATURES=['Hyper-V','Multipath-IO'];
const FW_REPLICA='Hyper-V Replica HTTP Listener (TCP-In)';

/* ============================================================
   State
   ============================================================ */
let S, uid=1, fast=false;
function mkMachine(name,physical){return {name,physical:!!physical,features:{},domain:null,pendingDomain:null,isDC:false,pendingDC:false,dns:physical?'192.168.1.1':DCIP,nicOff:{},hostIps:{},fw:{replica:false},hv:{migration:false,auth:'CredSSP',replica:null},iscsi:{portals:[],sessions:[]},mpio:false,set:null}}
function fresh(){return {v:3,machines:{[HOST]:mkMachine(HOST,true)},vms:{},vhds:{},switches:{[HOST]:{}},nat:null,iscsi:{targets:{},vdisks:{}},cluster:null,events:[],flags:{},incidents:{},log:[],uid:1,ctx:HOST,sel:'p1t1'}}
function load(){try{const s=JSON.parse(localStorage.getItem('hvlab-sim'));if(s&&s.v===3){uid=s.uid||1;return s}}catch(e){}return fresh()}
function save(){S.uid=uid;try{localStorage.setItem('hvlab-sim',JSON.stringify(S))}catch(e){}}
S=load();

/* ============================================================
   Helpers
   ============================================================ */
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,fast?Math.min(ms,ms/6+80):ms));
const lc=s=>String(s).toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtBytes(b){if(b==null)return '';if(b>=GB)return (b/GB).toFixed(b%GB?1:0)+' GB';return Math.round(b/MB)+' MB'}
function now(){const d=new Date();return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function ev(src,id,level,msg){S.events.unshift({t:now(),src,id,level,msg});if(S.events.length>120)S.events.length=120}
function vmList(parent){return Object.values(S.vms).filter(v=>!parent||v.parent===parent)}
function findVM(parent,name){return Object.values(S.vms).find(v=>v.parent===parent&&lc(v.name)===lc(name))}
function findVMany(name){return Object.values(S.vms).find(v=>lc(v.name)===lc(name)&&!v.replicaOf&&!v.testOf)}
function guestVM(m){return Object.values(S.vms).find(v=>v.parent===HOST&&v.name===m)}
function vhdRoot(path){let p=path,g=0;while(p&&S.vhds[lc(p)]&&S.vhds[lc(p)].parent&&g++<10)p=S.vhds[lc(p)].parent;return GOLDEN[p]?p:(Object.keys(GOLDEN).find(k=>lc(k)===lc(p))||null)}
function hasOS(v){return v.parent===HOST&&v.vhd&&!!vhdRoot(v.vhd)&&v.gen===2}
function machineUp(name){const m=S.machines[name];if(!m)return false;if(m.physical)return true;const v=guestVM(name);return !!(v&&v.state==='Running'&&v.booted)}
function featureState(m,f){return m.features[f]||null}
function has(m,f){return featureState(m,f)==='Installed'}
function ensureGuest(v){if(!S.machines[v.name]){S.machines[v.name]=mkMachine(v.name,false);ev(v.name,'Setup',0,`First boot of ${v.name} completed: specialize pass applied the unattend answer file (computer name, password, NIC names, planned IPs).`)}return S.machines[v.name]}
function sizeOf(v){return v.mem}
function usedMem(parent){return vmList(parent).filter(v=>v.state==='Running').reduce((a,v)=>a+v.mem,0)}
function capMem(parent){if(parent===HOST)return HOST_RAM-HOST_RESERVE;const v=guestVM(parent);return v?Math.max(0,v.mem-2*GB):0}

/* NICs as seen inside a machine */
function nicsOf(name){
  const m=S.machines[name];if(!m)return [];
  if(m.physical){
    const list=[{alias:'Ethernet',ip:'192.168.1.50',len:24,sw:'(physical)',enabled:true,vlan:0,gw:'192.168.1.1'}];
    Object.entries(S.switches[HOST]||{}).forEach(([n,s])=>{if(s.type==='Internal'){list.push({alias:`vEthernet (${n})`,ip:m.hostIps[n]||'169.254.83.12',len:m.hostIps[n]?24:16,sw:n,enabled:true,vlan:0,mgmtSw:n})}});
    return list;
  }
  const v=guestVM(name);if(!v)return [];
  return v.nics.map((a,i)=>{const role=ROLE_OF[a.switch];let alias=role||(i?`Ethernet ${i+1}`:'Ethernet');
    const setOn=m.set&&role&&m.set.nic===role;if(setOn)alias=`vEthernet (${m.set.name})`;
    const ip=(role&&PLAN[name]&&PLAN[name][role])||null;
    return {alias,role,ip:ip||'169.254.40.7',len:ip?24:16,sw:a.switch,enabled:!m.nicOff[role||alias],vlan:a.vlan||0,gw:role==='Mgmt'?'10.10.0.1':null,real:!!ip}});
}
function nicByRole(name,role){return nicsOf(name).find(n=>n.role===role||(role==='Mgmt'&&n.mgmtSw==='HVLAB-Mgmt'))}
function reach(a,b,role){
  if(!machineUp(a)||!machineUp(b))return false;
  const A=nicsOf(a),B=nicsOf(b);
  return A.some(x=>x.enabled&&x.sw&&x.sw!=='(physical)'&&(x.real||S.machines[a].physical)&&B.some(y=>y.enabled&&y.sw===x.sw&&y.vlan===x.vlan&&(y.real||S.machines[b].physical)&&(!role||ROLE_OF[x.sw]===role)));
}
function machineByIP(ip){for(const n of Object.keys(S.machines)){if(nicsOf(n).some(x=>x.ip===ip&&(x.real||S.machines[n].physical)))return n}return null}
function canAuth(name){ // domain auth / DNS for a member
  const m=S.machines[name];
  if(!m||!m.domain)return {ok:false,why:'not joined'};
  if(m.dns!==DCIP)return {ok:false,why:'dns'};
  const dc=S.machines.DC01;if(!dc||!dc.isDC)return {ok:false,why:'nodc'};
  if(!reach(name,'DC01','Mgmt'))return {ok:false,why:'reach'};
  return {ok:true};
}
function resolveName(from,name){
  let n=String(name).replace(/\.hvlab\.internal$/i,'').toUpperCase();
  const m=S.machines[from];
  if(/^\d+\.\d+\.\d+\.\d+$/.test(name))return {ip:name,machine:machineByIP(name)};
  if(from!==HOST&&(m.dns!==DCIP||!S.machines.DC01||!S.machines.DC01.isDC||!reach(from,'DC01','Mgmt')))return {err:'dns'};
  if(from===HOST)return {err:'nxdomain'};
  const target=S.machines[n];
  if(n==='HVCLU01'&&S.cluster)return {ip:S.cluster.ip,machine:'HVCLU01'};
  if(S.cluster&&S.cluster.groups['HVCLU01-RB']&&n==='HVCLU01-RB')return {ip:'10.10.0.51',machine:'HVCLU01-RB'};
  if(!target||!(target.domain===DOMAIN||target.isDC))return {err:'nxdomain'};
  const nic=nicByRole(n,'Mgmt');return {ip:nic?nic.ip:'',machine:n};
}

/* ============================================================
   Output
   ============================================================ */
const out=$('out');
function print(text,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=text;out.appendChild(d);S.log.push([text,cls||'']);if(S.log.length>500)S.log.splice(0,S.log.length-500);out.scrollTop=out.scrollHeight}
class PSErr extends Error{constructor(cmd,msg,cat){super(msg);this.cmd=cmd;this.cat=cat||'InvalidOperation'}}
function perr(e,line){print(`${e.cmd} : ${e.message}\n    + CategoryInfo          : ${e.cat}: (:) [${e.cmd}], ${e.cat==='ObjectNotFound'?'ItemNotFoundException':'Exception'}\n    + FullyQualifiedErrorId : ${e.cat},${e.cmd}`,'e')}
function warn(t){print('WARNING: '+t,'w')}
function fmtVal(v){if(v===true)return 'True';if(v===false)return 'False';if(v==null)return '';if(Array.isArray(v))return '{'+v.join(', ')+'}';return String(v)}
function table(rows,cols){
  if(!rows.length)return;
  cols=cols||Object.keys(rows[0]);
  const w=cols.map(c=>Math.max(c.length,...rows.map(r=>fmtVal(r[c]).length)));
  const lines=[cols.map((c,i)=>c.padEnd(w[i])).join(' '),cols.map((c,i)=>'-'.repeat(c.length).padEnd(w[i])).join(' ')];
  rows.forEach(r=>lines.push(cols.map((c,i)=>fmtVal(r[c]).padEnd(w[i])).join(' ').trimEnd()));
  print('\n'+lines.join('\n')+'\n');
}

/* ============================================================
   Parser
   ============================================================ */
function tokenize(s){
  const t=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(c==='|'){t.push({k:'pipe'});i++;continue}
    if(c===','){t.push({k:'comma'});i++;continue}
    if(c==='"'||c==="'"){let j=i+1,v='';while(j<s.length&&s[j]!==c){v+=s[j];j++}t.push({k:'str',v});i=j+1;continue}
    let j=i,v='';while(j<s.length&&!/[\s|,]/.test(s[j])){v+=s[j];j++}t.push({k:'word',v});i=j}
  return t;
}
function conv(tok){
  if(tok.k==='str')return tok.v;
  const v=tok.v;
  if(/^\$true$/i.test(v))return true; if(/^\$false$/i.test(v))return false;
  const m=v.match(/^(\d+(?:\.\d+)?)(KB|MB|GB|TB)$/i);
  if(m)return Math.round(parseFloat(m[1])*{kb:1024,mb:MB,gb:GB,tb:GB*1024}[lc(m[2])]);
  if(/^\d+$/.test(v))return parseInt(v,10);
  return v;
}
function parseSeg(toks){
  const cmd=toks[0]&&toks[0].v;const named={},pos=[];let i=1;
  const isParam=t=>t&&t.k==='word'&&/^-[A-Za-z]/.test(t.v);
  const readVal=()=>{const vals=[conv(toks[i])];i++;while(toks[i]&&toks[i].k==='comma'&&toks[i+1]){vals.push(conv(toks[i+1]));i+=2}return vals.length>1?vals:vals[0]};
  while(i<toks.length){const t=toks[i];
    if(isParam(t)){let name=t.v.slice(1);let val;
      const ci=name.indexOf(':');
      if(ci>0){val=conv({k:'word',v:name.slice(ci+1)});name=name.slice(0,ci);i++}
      else{i++;if(i<toks.length&&!isParam(toks[i])&&toks[i].k!=='comma')val=readVal();else val=true}
      named[lc(name)]=val;
    }else if(t.k==='comma'){i++}else{pos.push(readVal())}}
  return {cmd,named,pos};
}
function P(p,names,idx){for(const n of [].concat(names)){if(p.named[lc(n)]!==undefined)return p.named[lc(n)]}if(idx!=null&&p.pos[idx]!==undefined)return p.pos[idx];return undefined}

function modAvailable(mod,m){
  if(!mod)return true;

  if(mod==='mpio')return !!m.features['Multipath-IO'];
  return true;
}

async function restartMachine(name){
  const m=S.machines[name];
  if(m.physical){
    print(`${name} is restarting...`,'d');ev(name,'1074',1,'The system is restarting to complete pending operations.');
    if(S.ctx!==HOST)S.ctx=HOST;
    await sleep(2500);settlePending(m);print(`${name} is back online. Pending feature installations completed.`,'k');refresh();return;
  }
  const v=guestVM(name);
  if(S.ctx===name){S.ctx=HOST;print(`[${name}] The remote session ended because ${name} is restarting.`,'d')}
  v.booted=false;refresh();
  await sleep(3000);settlePending(m);
  if(v.state==='Running'){v.booted=true;print(`${name} restarted and is back online.`,'k');clusterRejoin(name)}
  refresh();
}
function settlePending(m){
  Object.keys(m.features).forEach(f=>{if(m.features[f]==='Pending'){m.features[f]='Installed';ev(m.name,'Servicing',0,`Feature ${f} configured after restart.`)}});
  if(m.pendingDomain){m.domain=m.pendingDomain;m.pendingDomain=null;ev(m.name,'Netlogon',0,`${m.name} joined domain ${m.domain}.`)}
  if(m.pendingDC){m.pendingDC=false;m.isDC=true;m.domain=DOMAIN;m.features['DNS']='Installed';m.dns=DCIP;ev(m.name,'ADDS',0,`DC01 is now the first domain controller of the ${DOMAIN} forest. DNS Server role installed.`)}
}

def(['Install-WindowsFeature','Add-WindowsFeature','Enable-WindowsOptionalFeature'],null,async(m,p)=>{
  let names=arr(P(p,['Name','FeatureName'],0)).map(n=>n==='Microsoft-Hyper-V-All'||n==='Microsoft-Hyper-V'?'Hyper-V':n);
  if(!names.length)throw new PSErr('Install-WindowsFeature','Specify -Name.','InvalidArgument');

  for(const n of names){const k=Object.keys(FEATURES).find(f=>lc(f)===lc(n));if(!k)throw new PSErr('Install-WindowsFeature',`ArgumentNotValid: The role, role service, or feature name is not valid: '${n}'. The name was not found.`,'InvalidArgument');}

  if(names.includes('Hyper-V')&&!m.physical){const v=guestVM(m.name);if(!v.expose){await sleep(900);throw new PSErr('Install-WindowsFeature',`Hyper-V cannot be installed: The processor does not have required virtualization capabilities. (On the physical host, turn the VM off and run Set-VMProcessor -VMName ${m.name} -ExposeVirtualizationExtensions $true.)`)}}
  if(names.includes('Hyper-V')&&m.physical&&m.features['Hyper-V']){print('No changes: Hyper-V is already '+lc(m.features['Hyper-V'])+'.','d')}
  print('Start Installation...','d');await sleep(900);print('[oooooooooooooooooooooooooooooo  ]  ... 93%','d');await sleep(1100);
  let restart=false;
  names.forEach(n=>{if(m.features[n])return;if(RESTART_FEATURES.includes(n)){m.features[n]='Pending';restart=true}else m.features[n]='Installed';
    if(n==='Hyper-V'&&tools)m.features['Hyper-V-PowerShell']='Installed';if(n==='Failover-Clustering')m.features['RSAT-Clustering-PowerShell']='Installed';if(n==='Multipath-IO')m.mpio=true});
  table([{Success:true,'Restart Needed':restart?'Yes':'No','Exit Code':restart?'SuccessRestartRequired':'Success','Feature Result':'{'+names.map(n=>FEATURES[n]).join(', ')+'}'}]);
  if(names.includes('Hyper-V')&&!tools)warn('Run with -IncludeManagementTools to also get Hyper-V Manager and the Hyper-V PowerShell module. (The simulator installs the module anyway.)');
  ev(m.name,'Servicing',0,`Installed ${names.join(', ')}${restart?' (restart required)':''}.`);
  if(restart){if(P(p,'Restart')){await restartMachine(m.name)}else warn('You must restart this server to finish the installation process.')}
},'Install roles/features (-Name, -IncludeManagementTools, -Restart)');

  {id:'p3t1',title:'Create differencing disks for DC01, STOR01, HV01, HV02 and HV03',on:HOST,why:'C:\\Images\\WS2025-Core.vhdx is a generalized (Sysprepped) Server Core image. A differencing disk per VM is an instant clone: the parent stays read-only and each child only stores its changes.',hint:'New-VHD -Path C:\\VMs\\DC01.vhdx -ParentPath C:\\Images\\WS2025-Core.vhdx -Differencing (repeat per VM)',check:()=>NAMES.every(n=>{const d=S.vhds[lc(`C:\\VMs\\${n}.vhdx`)];return d&&vhdRoot(d.path)}),sol:()=>NAMES.filter(n=>!S.vhds[lc(`C:\\VMs\\${n}.vhdx`)]).map(n=>[HOST,`New-VHD -Path C:\\VMs\\${n}.vhdx -ParentPath C:\\Images\\WS2025-Core.vhdx -Differencing`])},
  {id:'p3t2',title:'Create Generation 2 VMs on HVLAB-Mgmt',on:HOST,why:'Generation 2 means UEFI, Secure Boot and SCSI boot, and it is required for this GPT image. New-VM defaults to Generation 1, so always pass -Generation 2. Sizes: DC01 and STOR01 2 GB, HV01 and HV02 12 GB, HV03 8 GB.',hint:'New-VM -Name DC01 -Generation 2 -MemoryStartupBytes 2GB -VHDPath C:\\VMs\\DC01.vhdx -SwitchName HVLAB-Mgmt',check:()=>NAMES.every(n=>{const v=vmOn(n);return v&&v.gen===2&&v.vhd&&vhdRoot(v.vhd)&&v.nics.some(a=>a.switch==='HVLAB-Mgmt')}),sol:()=>NAMES.filter(n=>!vmOn(n)).map(n=>[HOST,`New-VM -Name ${n} -Generation 2 -MemoryStartupBytes ${MEMS[n]} -VHDPath C:\\VMs\\${n}.vhdx -SwitchName HVLAB-Mgmt`])},
  {id:'p3t3',title:'Add storage and cluster network adapters',on:HOST,why:'STOR01, HV01 and HV02 need a NIC on HVLAB-Storage for iSCSI. HV01 and HV02 also need one on HVLAB-Cluster for heartbeat and live migration. Name each adapter after its network so it is easy to identify inside the guest.',hint:'Add-VMNetworkAdapter -VMName STOR01,HV01,HV02 -Name Storage -SwitchName HVLAB-Storage',check:()=>['STOR01','HV01','HV02'].every(n=>vmOn(n)&&vmOn(n).nics.some(a=>a.switch==='HVLAB-Storage'))&&['HV01','HV02'].every(n=>vmOn(n).nics.some(a=>a.switch==='HVLAB-Cluster')),sol:()=>[[HOST,'Add-VMNetworkAdapter -VMName STOR01,HV01,HV02 -Name Storage -SwitchName HVLAB-Storage'],[HOST,'Add-VMNetworkAdapter -VMName HV01,HV02 -Name Cluster -SwitchName HVLAB-Cluster']]},
  {id:'p3t4',title:'Prepare HV01-HV03 for nested virtualization',on:HOST,why:'To run Hyper-V inside a VM, the parent must expose the CPU\'s virtualization extensions (VM off, static memory), and MAC address spoofing lets the nested VMs\' traffic out. Give the hosts 4 vCPUs too.',hint:'Set-VMProcessor -VMName HV01,HV02,HV03 -ExposeVirtualizationExtensions $true -Count 4, then Set-VMNetworkAdapter ... -MacAddressSpoofing On',check:()=>['HV01','HV02','HV03'].every(n=>{const v=vmOn(n);return v&&v.expose&&!v.dynamic&&v.nics.every(a=>a.spoof)}),sol:()=>[[HOST,'Set-VMProcessor -VMName HV01,HV02,HV03 -ExposeVirtualizationExtensions $true -Count 4'],[HOST,'Set-VMNetworkAdapter -VMName HV01,HV02,HV03 -MacAddressSpoofing On']]},
  {id:'p3t5',title:'Start the VMs and wait for first boot',on:HOST,why:'At first boot, the answer file sets each computer name, names the NICs after their networks and assigns the planned static IPs. Use Get-VM, then Enter-PSSession -VMName DC01 and ipconfig to check.',hint:'Start-VM -Name DC01,STOR01,HV01,HV02,HV03',check:()=>NAMES.every(n=>machineUp(n)),sol:()=>[[HOST,'Start-VM -Name DC01,STOR01,HV01,HV02,HV03']],wait:NAMES}]},
 {id:'p4',title:'Build identity: AD DS and DNS',tasks:[
  {id:'p4t1',title:'Promote DC01 to the first domain controller of hvlab.internal',on:'DC01',why:'Clustering, Kerberos live migration and Replica all depend on AD and DNS. Install the role, then create the forest. DC01 restarts as a domain controller with DNS.',hint:'On DC01: Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools, then Install-ADDSForest -DomainName hvlab.internal -InstallDns',check:()=>M('DC01')&&M('DC01').isDC,sol:()=>[['DC01','Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools'],['DC01','Install-ADDSForest -DomainName hvlab.internal -InstallDns']],wait:['DC01']},
  {id:'p4t2',title:'Join STOR01, HV01, HV02 and HV03 to the domain',on:'each server',why:'Every member points its DNS at DC01 (10.10.0.10). Add-Computer needs the DC reachable on the management network.',hint:'In each VM: Add-Computer -DomainName hvlab.internal -Restart',check:()=>['STOR01','HV01','HV02','HV03'].every(n=>M(n)&&M(n).domain===DOMAIN),sol:()=>['STOR01','HV01','HV02','HV03'].filter(n=>!(M(n)&&M(n).domain===DOMAIN)).map(n=>[n,'Add-Computer -DomainName hvlab.internal -Restart']),wait:['STOR01','HV01','HV02','HV03']}]},
 {id:'p5',title:'Configure the Hyper-V hosts',tasks:[
  {id:'p5t1',title:'Install Hyper-V, Failover Clustering and MPIO',on:'HV01, HV02, HV03',why:'HV01 and HV02 become cluster nodes and need Hyper-V, Failover-Clustering and Multipath-IO. HV03 is the standalone DR host and only needs Hyper-V. Each restarts once.',hint:'On HV01: Install-WindowsFeature -Name Hyper-V,Failover-Clustering,Multipath-IO -IncludeManagementTools -Restart',check:()=>['HV01','HV02'].every(n=>M(n)&&['Hyper-V','Failover-Clustering','Multipath-IO'].every(f=>has(M(n),f)))&&M('HV03')&&has(M('HV03'),'Hyper-V'),sol:()=>[['HV01','Install-WindowsFeature -Name Hyper-V,Failover-Clustering,Multipath-IO -IncludeManagementTools -Restart'],['HV02','Install-WindowsFeature -Name Hyper-V,Failover-Clustering,Multipath-IO -IncludeManagementTools -Restart'],['HV03','Install-WindowsFeature -Name Hyper-V -IncludeManagementTools -Restart']],wait:['HV01','HV02','HV03']},
  {id:'p5t2',title:'Create a SET switch named SETswitch on each host',on:'HV01, HV02, HV03',why:'Switch Embedded Teaming is the recommended external switch on Hyper-V hosts. It is bound to the Mgmt NIC, the management OS shares it, and the name must match on every node so VMs keep their network after failover.',hint:'New-VMSwitch -Name SETswitch -NetAdapterName Mgmt -EnableEmbeddedTeaming $true -AllowManagementOS $true',check:()=>['HV01','HV02','HV03'].every(n=>S.switches[n]&&S.switches[n].SETswitch&&S.switches[n].SETswitch.set),sol:()=>['HV01','HV02','HV03'].filter(n=>!(S.switches[n]&&S.switches[n].SETswitch)).map(n=>[n,'New-VMSwitch -Name SETswitch -NetAdapterName Mgmt -EnableEmbeddedTeaming $true -AllowManagementOS $true'])},
  {id:'p5t3',title:'Enable live migration with Kerberos authentication',on:'HV01, HV02, HV03',why:'Kerberos (with constrained delegation in AD) lets you start migrations remotely. CredSSP only works when you are logged on to the source host.',hint:'Enable-VMMigration; Set-VMHost -VirtualMachineMigrationAuthenticationType Kerberos',check:()=>['HV01','HV02','HV03'].every(n=>M(n)&&M(n).hv.migration&&M(n).hv.auth==='Kerberos'),sol:()=>['HV01','HV02','HV03'].flatMap(n=>[[n,'Enable-VMMigration'],[n,'Set-VMHost -VirtualMachineMigrationAuthenticationType Kerberos']])}]},
 {id:'p6',title:'Provision shared storage (iSCSI SAN)',tasks:[
  {id:'p6t1',title:'Install iSCSI Target Server on STOR01',on:'STOR01',why:'STOR01 plays the SAN. iSCSI Target Server presents VHDX files as LUNs over the storage network.',hint:'Install-WindowsFeature -Name FS-iSCSITarget-Server -IncludeManagementTools',check:()=>M('STOR01')&&has(M('STOR01'),'FS-iSCSITarget-Server'),sol:()=>[['STOR01','Install-WindowsFeature -Name FS-iSCSITarget-Server -IncludeManagementTools']]},
  {id:'p6t2',title:'Create target HVCLU01 that only HV01 and HV02 may use',on:'STOR01',why:'LUN masking: the target lists the initiators allowed to log on. HV03 must not see the cluster disks.',hint:'New-IscsiServerTarget -TargetName HVCLU01 -InitiatorIds "IPAddress:10.10.20.11","IPAddress:10.10.20.12"',check:()=>{const t=S.iscsi.targets['hvclu01'];return t&&['10.10.20.11','10.10.20.12'].every(ip=>t.ids.some(i=>lc(i)===lc('IPAddress:'+ip)))},sol:()=>[['STOR01','New-IscsiServerTarget -TargetName HVCLU01 -InitiatorIds "IPAddress:10.10.20.11","IPAddress:10.10.20.12"']]},
  {id:'p6t3',title:'Create and map a 120 GB CSV LUN and a 1 GB witness LUN',on:'STOR01',why:'Clusters use one small LUN as the quorum witness and one or more large LUNs as Cluster Shared Volumes for VM files.',hint:'New-IscsiVirtualDisk -Path E:\\iSCSI\\CSV01.vhdx -SizeBytes 120GB, then Add-IscsiVirtualDiskTargetMapping -TargetName HVCLU01 -Path ...',check:()=>{const t=S.iscsi.targets['hvclu01'];if(!t)return false;const sz=t.luns.map(l=>S.iscsi.vdisks[lc(l)].size);return sz.some(s=>s>=100*GB)&&sz.some(s=>s<=5*GB)},sol:()=>[['STOR01','New-IscsiVirtualDisk -Path E:\\iSCSI\\CSV01.vhdx -SizeBytes 120GB'],['STOR01','New-IscsiVirtualDisk -Path E:\\iSCSI\\Witness.vhdx -SizeBytes 1GB'],['STOR01','Add-IscsiVirtualDiskTargetMapping -TargetName HVCLU01 -Path E:\\iSCSI\\CSV01.vhdx'],['STOR01','Add-IscsiVirtualDiskTargetMapping -TargetName HVCLU01 -Path E:\\iSCSI\\Witness.vhdx']]},
  {id:'p6t4',title:'Connect HV01 and HV02 to the target with MPIO',on:'HV01, HV02',why:'Each node adds STOR01\'s storage IP as a portal and logs on with a persistent, multipath-enabled session, so the disks come back after every reboot.',hint:'Enable-MSDSMAutomaticClaim -BusType iSCSI; New-IscsiTargetPortal -TargetPortalAddress 10.10.20.30; Get-IscsiTarget | Connect-IscsiTarget -IsPersistent $true -IsMultipathEnabled $true',check:()=>['HV01','HV02'].every(n=>M(n)&&M(n).iscsi.sessions.some(s=>s.persistent)&&lunsSeenBy(n).length>=2),sol:()=>['HV01','HV02'].flatMap(n=>[[n,'Enable-MSDSMAutomaticClaim -BusType iSCSI'],[n,'New-IscsiTargetPortal -TargetPortalAddress 10.10.20.30'],[n,'Get-IscsiTarget | Connect-IscsiTarget -IsPersistent $true -IsMultipathEnabled $true'],[n,'Get-Disk']])}]},
 {id:'p7',title:'Create the failover cluster',tasks:[
  {id:'p7t1',title:'Validate the nodes with Test-Cluster',on:'HV01',why:'Microsoft only supports clusters that pass validation. Read the warnings: some are acceptable in a lab, but failures are not.',hint:'Test-Cluster -Node HV01,HV02',check:()=>!!S.flags.testCluster,sol:()=>[['HV01','Test-Cluster -Node HV01,HV02']]},
  {id:'p7t2',title:'Create cluster HVCLU01 at 10.10.0.50',on:'HV01',why:'New-Cluster creates the cluster name object in AD, registers DNS and starts the cluster service. -NoStorage lets you choose the disk roles yourself.',hint:'New-Cluster -Name HVCLU01 -Node HV01,HV02 -StaticAddress 10.10.0.50 -NoStorage',check:()=>!!S.cluster,sol:()=>[['HV01','New-Cluster -Name HVCLU01 -Node HV01,HV02 -StaticAddress 10.10.0.50 -NoStorage']]},
  {id:'p7t3',title:'Add the disks, set the witness and create the CSV',on:'HV01',why:'A two-node cluster must have a witness, otherwise losing one node can take everything down. Use the 1 GB disk as the witness and the 120 GB disk as Cluster Shared Volume 1. Check sizes with Get-ClusterResource.',hint:'Get-ClusterAvailableDisk | Add-ClusterDisk; Set-ClusterQuorum -DiskWitness "Cluster Disk N"; Add-ClusterSharedVolume -Name "Cluster Disk M"',check:()=>S.cluster&&S.cluster.quorum.type==='NodeAndDiskMajority'&&S.cluster.disks.some(d=>d.csv),sol:()=>{const st=[];if(S.cluster&&S.cluster.disks.length<2)st.push(['HV01','Get-ClusterAvailableDisk | Add-ClusterDisk']);const later=()=>{};st.push(['HV01','@witness']);st.push(['HV01','@csv']);return st}},
  {id:'p7t4',title:'Name the cluster networks Mgmt, Storage and Cluster',on:'HV01',why:'Clear names make the role of each network obvious during an incident. Check that Storage has role None: iSCSI must never carry cluster traffic.',hint:'(Get-ClusterNetwork "Cluster Network 1").Name = "Mgmt"',check:()=>S.cluster&&['Mgmt','Storage','Cluster'].every(n=>S.cluster.networks.some(x=>x.name===n&&x.kind===n)),sol:()=>S.cluster?S.cluster.networks.filter(x=>x.name!==x.kind).map(x=>['HV01',`(Get-ClusterNetwork "${x.name}").Name = "${x.kind}"`]):[]}]},
 {id:'p8',title:'Run highly available workloads',tasks:[
  {id:'p8t1',title:'Create SHELL01 on the CSV and make it highly available',on:'HV01',why:'A VM is highly available only if its files are on shared storage (the CSV) and it is a clustered role. SHELL01 is a small empty VM, which is perfect for migration drills.',hint:'New-VM ... -Path C:\\ClusterStorage\\Volume1 -NewVHDPath C:\\ClusterStorage\\Volume1\\SHELL01.vhdx -NewVHDSizeBytes 20GB -SwitchName SETswitch; Add-ClusterVirtualMachineRole -VMName SHELL01; Start-ClusterGroup -Name SHELL01',check:()=>S.cluster&&S.cluster.groups.SHELL01&&S.cluster.groups.SHELL01.state==='Online',sol:()=>[['HV01','New-VM -Name SHELL01 -Generation 2 -MemoryStartupBytes 512MB -Path C:\\ClusterStorage\\Volume1 -NewVHDPath C:\\ClusterStorage\\Volume1\\SHELL01.vhdx -NewVHDSizeBytes 20GB -SwitchName SETswitch'],['HV01','Add-ClusterVirtualMachineRole -VMName SHELL01'],['HV01','Start-ClusterGroup -Name SHELL01']]},
  {id:'p8t2',title:'Live-migrate SHELL01 to the other node',on:'HV01',why:'Live migration moves memory and state while the VM keeps running. Storage stays on the CSV, so only RAM crosses the cluster network.',hint:'Move-ClusterVirtualMachineRole -Name SHELL01 -Node HV02 -MigrationType Live',check:()=>!!S.flags.liveMigrated,sol:()=>{const g=S.cluster&&S.cluster.groups.SHELL01;const t=g&&g.owner==='HV02'?'HV01':'HV02';return [['HV01',`Move-ClusterVirtualMachineRole -Name SHELL01 -Node ${t} -MigrationType Live`]]}},
  {id:'p8t3',title:'Drain a node for maintenance, then resume it',on:'HV01',why:'Before patching a host, pause it with -Drain: its roles live-migrate away. Resume with -Failback Immediate to bring them home.',hint:'Suspend-ClusterNode -Name HV02 -Drain; Resume-ClusterNode -Name HV02 -Failback Immediate',check:()=>!!S.flags.drained&&!!S.flags.resumed,sol:()=>{const g=S.cluster&&S.cluster.groups.SHELL01;const n=g?g.owner:'HV02';return [['HV01',`Suspend-ClusterNode -Name ${n} -Drain`],['HV01','Get-ClusterGroup'],['HV01',`Resume-ClusterNode -Name ${n} -Failback Immediate`]]}},
  {id:'p8t4',title:'Survive an unplanned node failure',on:HOST,why:'Pull the plug on the node that owns SHELL01 (Stop-VM -TurnOff on the physical host). The cluster detects the loss, keeps quorum thanks to the witness and restarts SHELL01 on the survivor. Then start the node again and check it rejoins.',hint:'Stop-VM -Name <owner> -TurnOff, check the Cluster tab and Events, then Start-VM -Name <owner>',check:()=>!!S.flags.failoverSurvived&&S.cluster&&Object.values(S.cluster.nodes).every(x=>x.state!=='Down'),sol:()=>{const g=S.cluster&&S.cluster.groups.SHELL01;const n=g?g.owner:'HV02';return [[HOST,`Stop-VM -Name ${n} -TurnOff`],[HOST,`Start-VM -Name ${n}`]]},wait:['HV01','HV02']}]},
 {id:'p9',title:'Protect workloads with Hyper-V Replica',tasks:[
  {id:'p9t1',title:'Make HV03 a Replica server',on:'HV03',why:'HV03 is the DR host. It must accept replication (Kerberos over HTTP port 80) and open the matching inbound firewall rule.',hint:'Set-VMReplicationServer -ReplicationEnabled $true -AllowedAuthenticationType Kerberos -ReplicationAllowedFromAnyServer $true -DefaultStorageLocation C:\\Replica; Enable-NetFirewallRule -DisplayName "Hyper-V Replica HTTP Listener (TCP-In)"',check:()=>M('HV03')&&M('HV03').hv.replica&&M('HV03').hv.replica.enabled&&M('HV03').fw.replica,sol:()=>[['HV03','Set-VMReplicationServer -ReplicationEnabled $true -AllowedAuthenticationType Kerberos -ReplicationAllowedFromAnyServer $true -DefaultStorageLocation C:\\Replica'],['HV03',`Enable-NetFirewallRule -DisplayName "${FW_REPLICA}"`]]},
  {id:'p9t2',title:'Create the Hyper-V Replica Broker role',on:'HV01',why:'Clustered VMs move between nodes, so replication needs a cluster-wide endpoint: the Replica Broker, with its own name and IP (10.10.0.51).',hint:'Add-ClusterServerRole -Name HVCLU01-RB -StaticAddress 10.10.0.51; Add-ClusterResource -Name "Virtual Machine Replication Broker" -Type "Virtual Machine Replication Broker" -Group HVCLU01-RB; Start-ClusterGroup -Name HVCLU01-RB',check:()=>S.cluster&&!!S.cluster.broker,sol:()=>[['HV01','Add-ClusterServerRole -Name HVCLU01-RB -StaticAddress 10.10.0.51'],['HV01','Add-ClusterResource -Name "Virtual Machine Replication Broker" -Type "Virtual Machine Replication Broker" -Group HVCLU01-RB'],['HV01','Start-ClusterGroup -Name HVCLU01-RB']]},
  {id:'p9t3',title:'Replicate SHELL01 to HV03',on:'owner of SHELL01',why:'Run Enable-VMReplication on the node that owns SHELL01, then send the initial copy. Health should read Normal.',hint:'Enable-VMReplication -VMName SHELL01 -ReplicaServerName HV03 -ReplicaServerPort 80 -AuthenticationType Kerberos; Start-VMInitialReplication -VMName SHELL01',check:()=>{const v=findVMany('SHELL01');return v&&v.replication&&v.replication.state==='Replicating'&&replicaHealth(v)==='Normal'},sol:()=>{const g=S.cluster&&S.cluster.groups.SHELL01;const n=g?g.owner:'HV01';return [[n,'Enable-VMReplication -VMName SHELL01 -ReplicaServerName HV03 -ReplicaServerPort 80 -AuthenticationType Kerberos'],[n,'Start-VMInitialReplication -VMName SHELL01'],[n,'Get-VMReplication']]}},
  {id:'p9t4',title:'Run a DR test failover and clean it up',on:'HV03',why:'A test failover proves the replica boots without touching production: it creates "SHELL01 - Test" with its network disconnected. Always stop the test afterwards.',hint:'Start-VMFailover -VMName SHELL01 -AsTest; Get-VM; Stop-VMFailover -VMName SHELL01',check:()=>!!S.flags.testCleaned,sol:()=>[['HV03','Start-VMFailover -VMName SHELL01 -AsTest'],['HV03','Get-VM'],['HV03','Stop-VMFailover -VMName SHELL01']]}]}
];
const ALLT=PHASES.flatMap(p=>p.tasks.map(t=>Object.assign(t,{phase:p})));
function taskDone(t){try{return !!t.check()}catch(e){return false}}
function checkTasks(){ALLT.forEach(t=>{const d=taskDone(t);if(d&&!S.done[t.id]){S.done[t.id]=true;toast('Task complete: '+t.title)}else if(!d&&S.done[t.id]&&t.id!==undefined){}});checkIncidents()}
S.done=S.done||{};

function checkIncidents(){INCIDENTS.forEach(i=>{const st=S.incidents[i.id];if(st==='active'&&i.fixed()){S.incidents[i.id]='solved';ev('ServiceDesk',i.ticket,0,`${i.ticket} resolved: ${i.title}.`);toast(`${i.ticket} resolved. Nice work.`)}})}

/* ============================================================
   UI: runbook
   ============================================================ */
function renderRunbook(){
  const rb=$('runbook');const open=new Set([...rb.querySelectorAll('details[open]')].map(d=>d.dataset.id));
  const firstOpen=!rb.children.length;
  rb.innerHTML='';let done=0;
  PHASES.forEach((p,pi)=>{const n=p.tasks.filter(taskDone).length;done+=n;
    const d=document.createElement('details');d.className='phase';d.dataset.id=p.id;
    if(open.has(p.id)||(firstOpen&&p.tasks.some(t=>t.id===S.sel)))d.open=true;
    d.innerHTML=`<summary><span class="ph-num">${String(pi+1).padStart(2,'0')}</span><span class="ph-title">${esc(p.title)}</span><span class="ph-count ${n===p.tasks.length?'done':''}">${n}/${p.tasks.length}</span></summary>`;
    p.tasks.forEach(t=>{const el=document.createElement('div');el.className='task'+(taskDone(t)?' ok':'')+(S.sel===t.id?' sel':'');el.tabIndex=0;el.setAttribute('role','button');el.innerHTML=`<span class="dot" aria-hidden="true"></span><span>${esc(t.title)}</span>`;
      el.onclick=()=>{S.sel=t.id;save();renderRunbook();renderDetail()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};d.appendChild(el)});
    rb.appendChild(d)});
  const total=ALLT.length;$('pbar').style.width=(done/total*100)+'%';$('ptext').textContent=`${done} / ${total} tasks`;
  const nxt=ALLT.find(t=>!taskDone(t));$('phaseNote').textContent=nxt?'next: phase '+(PHASES.indexOf(nxt.phase)+1):'complete';
}
function resolveSol(t){let steps=t.sol();
  steps=steps.map(([on,cmd])=>{if(cmd==='@witness'||cmd==='@csv'){const ds=S.cluster?S.cluster.disks.slice():[];if(!ds.length){const av=sharedLuns(upNodes()).sort((a,b)=>S.iscsi.vdisks[lc(a)].order-S.iscsi.vdisks[lc(b)].order);av.forEach((l,i)=>ds.push({name:'Cluster Disk '+(i+1),size:S.iscsi.vdisks[lc(l)].size}))}
    const small=ds.slice().sort((a,b)=>a.size-b.size)[0],big=ds.slice().sort((a,b)=>b.size-a.size)[0];
    return cmd==='@witness'?[on,`Set-ClusterQuorum -DiskWitness "${small?small.name:'Cluster Disk 2'}"`]:[on,`Add-ClusterSharedVolume -Name "${big?big.name:'Cluster Disk 1'}"`]}return [on,cmd]});
  return steps}
function renderDetail(){
  const t=ALLT.find(x=>x.id===S.sel)||ALLT[0];const d=$('detail');const ok=taskDone(t);
  let steps=[];try{steps=resolveSol(t)}catch(e){}
  d.innerHTML=`<div class="on">Run on: ${esc(t.on)}</div><h3>${esc(t.title)} ${ok?'<span class="pill p-ok">Done</span>':''}</h3><p>${esc(t.why)}</p>
  <details><summary>Hint</summary><p class="mono" style="margin-top:6px">${esc(t.hint)}</p></details>
  <details id="solDet"><summary>Show solution</summary><div class="sol">${steps.map(([on,c],i)=>`<span class="ctx">${esc(on)}</span><code data-i="${i}" title="Click to paste into the console">${esc(c)}</code>`).join('')||'<span class="ctx">Nothing left to run.</span>'}</div>
  <div class="row"><button class="primary" id="runSol" ${steps.length?'':'disabled'}>Run these commands for me</button></div></details>`;
  d.querySelectorAll('.sol code').forEach(c=>c.onclick=()=>{const [on,cmd]=steps[+c.dataset.i];const inp=$('cmd');if(on!==S.ctx&&on!=='owner of SHELL01'){toast(on===HOST?'Exit-PSSession first, then run this on LAB-HOST.':`Run this inside ${on}: Enter-PSSession -VMName ${on}`)}inp.value=cmd;inp.focus()});
  const rs=$('runSol');if(rs)rs.onclick=()=>runSolution(t);
}
async function waitUp(names,ms){const end=Date.now()+(ms||20000);while(Date.now()<end){if(names.every(machineUp))return true;await sleep(400)}return false}
async function runSolution(t){if(busy){toast('Wait for the current command to finish.');return}
  const steps=resolveSol(t);busy=true;$('busy').hidden=false;
  for(const [on,cmd] of steps){
    if(on!==S.ctx){if(S.ctx!==HOST){await execLine('Exit-PSSession')}if(on!==HOST){if(!(await waitUp([on])))print(`${on} is not up yet.`,'w');await execLine(`Enter-PSSession -VMName ${on}`)}updatePrompt()}
    if(on!==S.ctx&&on!==HOST){print('Stopped: could not open a session to '+on+'. Fix the error above and try again.','w');break}
    await execLine(cmd);updatePrompt();
    if(/-Restart\b|Install-ADDSForest|Start-VM/i.test(cmd)&&t.wait){await waitUp(t.wait.filter(n=>S.machines[n]||vmOn(n)),25000);if(S.ctx!==HOST&&!machineUp(S.ctx))S.ctx=HOST}
  }
  if(S.ctx!==HOST&&!/HV0|DC|STOR/.test(t.on)){}
  busy=false;$('busy').hidden=true;updatePrompt();checkTasks();save();refresh();
  if(queue.length)run([]);
}

/* ============================================================
   UI: right-hand views
   ============================================================ */
let tab='inv';
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));renderView()});
function stPill(v){if(v.replicaOf)return '<span class="pill p-idle">Replica</span>';if(v.state==='Running'){if(v.parent===HOST&&!hasOS(v))return '<span class="pill p-warn">No OS</span>';if(v.parent===HOST&&!v.booted)return '<span class="pill p-acc">Booting</span>';return '<span class="pill p-ok">Running</span>'}return '<span class="pill p-idle">Off</span>'}
function renderView(){
  const v=$('view');
  if(tab==='inv'){
    const hostReady=has(M(HOST),'Hyper-V');
    let h=`<div class="card"><h4>LAB-HOST <small>${hostReady?`Hyper-V · ${fmtBytes(usedMem(HOST))} of ${fmtBytes(capMem(HOST))} VM memory in use`:(M(HOST).features['Hyper-V']?'Hyper-V installed, restart pending':'Hyper-V not installed')}</small></h4>`;
    const vs=vmList(HOST);
    h+=vs.length?`<table class="t"><thead><tr><th>VM</th><th>State</th><th>Memory</th><th>Gen</th><th>IP</th></tr></thead><tbody>${vs.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.expose?' <span class="pill p-acc" title="Nested virtualization">nested</span>':''}${x.checkpoints.length?` <span class="pill p-warn">${x.checkpoints.length} ckpt</span>`:''}</td><td>${stPill(x)}</td><td class="mono">${fmtBytes(x.mem)}${x.dynamic?' dyn':''}</td><td class="mono">${x.gen}</td><td class="mono">${(PLAN[x.name]&&x.booted)?PLAN[x.name].Mgmt:''}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${hostReady?'No VMs yet. Phase 3 creates them.':'Install Hyper-V (phase 1) to start.'}</div>`;
    h+='</div>';
    ['HV01','HV02','HV03'].forEach(n=>{const m=M(n);if(!m||!m.features['Hyper-V'])return;const ns=vmList(n);
      h+=`<div class="card"><h4>${n} <small>${has(m,'Hyper-V')?'nested Hyper-V host':'restart pending'} · ${m.domain?'hvlab.internal':'workgroup'}${S.switches[n]&&S.switches[n].SETswitch?' · SETswitch':''}</small></h4>${ns.length?`<table class="t"><tbody>${ns.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.clustered?' <span class="pill p-acc">HA</span>':''}${x.replication&&!x.replicaOf?` <span class="pill ${replicaHealth(x)==='Normal'?'p-ok':replicaHealth(x)==='Critical'?'p-bad':'p-warn'}">replica ${replicaHealth(x)}</span>`:''}</td><td>${stPill(x)}</td><td class="mono">${fmtBytes(x.mem)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No VMs on this host.</div>'}</div>`});
    const sw=Object.entries(S.switches[HOST]||{});
    h+=`<div class="card"><h4>Virtual switches on LAB-HOST</h4>${sw.length?`<table class="t"><tbody>${sw.map(([n,s])=>`<tr><td><b>${esc(n)}</b></td><td>${s.type}</td><td class="mono">${s.type==='Internal'?(M(HOST).hostIps[n]||'no host IP'):''}</td></tr>`).join('')}${S.nat?`<tr><td><b>${esc(S.nat.name)}</b></td><td>NAT</td><td class="mono">${esc(S.nat.prefix)}</td></tr>`:''}</tbody></table>`:'<div class="empty">None yet.</div>'}</div>`;
    v.innerHTML=h;
  }else if(tab==='clu'){
    const c=S.cluster;
    if(!c){v.innerHTML=`<div class="card"><h4>Failover cluster</h4><div class="empty">No cluster yet. Phase 7 creates HVCLU01 from HV01 and HV02.${Object.keys(S.iscsi.targets).length?' Shared storage is being prepared.':''}</div></div>`+storageCard();return}
    const nodes=Object.entries(c.nodes).map(([n,x])=>`<tr><td><b>${n}</b></td><td><span class="pill ${x.state==='Up'?'p-ok':x.state==='Paused'?'p-warn':'p-bad'}">${x.state}</span></td><td class="mono">${fmtBytes(usedMem(n))} / ${fmtBytes(capMem(n))}</td></tr>`).join('');
    const groups=Object.entries(c.groups).map(([n,g])=>`<tr><td><b>${esc(n)}</b></td><td>${g.type==='VirtualMachine'?'VM':g.type==='VMReplicaBroker'?'Replica Broker':'Client access point'}</td><td>${g.owner}</td><td><span class="pill ${g.state==='Online'?'p-ok':g.state==='Failed'?'p-bad':'p-idle'}">${g.state}</span></td></tr>`).join('');
    const disks=c.disks.map(d=>`<tr><td><b>${d.name}</b></td><td class="mono">${fmtBytes(d.size)}</td><td>${d.csv?'CSV '+d.csv.replace('C:\\ClusterStorage\\',''):d.group==='Cluster Group'?'Witness':'Available'}</td><td><span class="pill ${diskOnline(d)?'p-ok':'p-bad'}">${diskOnline(d)?'Online':'Failed'}</span>${d.csv&&upNodes().some(n=>!lunsSeenBy(n).includes(d.lun))?' <span class="pill p-warn">redirected</span>':''}</td></tr>`).join('');
    const nets=c.networks.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="mono">${x.address}</td><td>${x.role===3?'Cluster and client':x.role===1?'Cluster only':'None'}</td></tr>`).join('');
    v.innerHTML=`<div class="card"><h4>${c.name} <small>${c.ip} · quorum ${c.quorum.type==='NodeMajority'?'<b style="color:var(--bad)">no witness</b>':esc(c.quorum.type)}</small></h4><table class="t"><thead><tr><th>Node</th><th>State</th><th>Memory</th></tr></thead><tbody>${nodes}</tbody></table></div>
    <div class="card"><h4>Roles</h4>${groups?`<table class="t"><tbody>${groups}</tbody></table>`:'<div class="empty">No clustered roles yet.</div>'}</div>
    <div class="card"><h4>Disks</h4>${disks?`<table class="t"><tbody>${disks}</tbody></table>`:'<div class="empty">No disks added. Get-ClusterAvailableDisk | Add-ClusterDisk</div>'}</div>
    <div class="card"><h4>Networks</h4><table class="t"><tbody>${nets}</tbody></table></div>`+storageCard();
  }else if(tab==='net'){v.innerHTML=topoSVG()}
  else if(tab==='inc'){
    v.innerHTML=`<p style="margin:0;font-size:12.5px;color:var(--muted)">Each ticket breaks something real in your environment. Diagnose it from the console with Get- cmdlets, fix it, and the ticket closes on its own. Tickets unlock as you build the parts they affect.</p>`+INCIDENTS.map(i=>{const st=S.incidents[i.id];const can=i.needs();return `<div class="inc ${st||''}"><div style="display:flex;justify-content:space-between;gap:8px"><span class="tk">${i.ticket} · ${i.sev}</span>${st==='solved'?'<span class="pill p-ok">Resolved</span>':st==='active'?'<span class="pill p-warn">Open</span>':''}</div><b>${esc(i.title)}</b>${st?`<span>${esc(i.report)}</span>`:''}${st==='active'?`<details><summary style="cursor:pointer;color:var(--accent);font-weight:600">Hint</summary><span>${esc(i.hint)}</span></details><details><summary style="cursor:pointer;color:var(--accent);font-weight:600">Answer</summary><span class="mono">${esc(i.answer)}</span></details>`:''}<div class="row" style="margin:0">${!st?`<button data-inc="${i.id}" ${can?'':'disabled'}>${can?'Open ticket':'Locked until you build this part'}</button>`:st==='solved'?`<button data-inc="${i.id}" class="ghost">Run again</button>`:''}</div></div>`}).join('');
    v.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const i=INCIDENTS.find(x=>x.id===b.dataset.inc);i.brk();S.incidents[i.id]='active';ev('ServiceDesk',i.ticket,1,`New ticket ${i.ticket}: ${i.title}`);print(`\nNew ticket ${i.ticket} (${i.sev}): ${i.report}\n`,'w');save();refresh()});
  }else{
    v.innerHTML=S.events.length?`<div class="card">${S.events.map(e=>`<div class="ev"><span class="pill ${e.level===2?'p-bad':e.level===1?'p-warn':'p-idle'}">${e.level===2?'Error':e.level===1?'Warning':'Info'}</span><span><span class="src">${esc(e.t)} · ${esc(e.src)} · ${esc(e.id)}</span><br>${esc(e.msg)}</span></div>`).join('')}</div>`:'<div class="empty">No events yet.</div>';
  }
}
function storageCard(){const ts=Object.values(S.iscsi.targets);if(!ts.length)return '';return `<div class="card"><h4>iSCSI SAN (STOR01)</h4><table class="t"><tbody>${ts.map(t=>`<tr><td><b>${esc(t.name)}</b><br><span class="mono">${esc(t.ids.join(', ')||'no initiators')}</span></td><td>${t.luns.length} LUN(s)<br>${t.luns.map(l=>fmtBytes(S.iscsi.vdisks[lc(l)].size)).join(' + ')}</td><td>${connectedNodes(t).map(n=>`<span class="pill p-ok">${n}</span>`).join(' ')||'<span class="pill p-idle">none</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function topoSVG(){
  const W=340,sw=S.switches[HOST]||{};const nets=[['HVLAB-Mgmt','#0b62c4',70],['HVLAB-Storage','#b7791f',300],['HVLAB-Cluster','#7c3aed',360]];
  const vms=vmList(HOST).filter(v=>!v.replicaOf);const cols=Math.max(1,vms.length);const gap=Math.min(68,(W-20)/cols);
  let g=`<svg class="topo" viewBox="0 0 ${W} 400" role="img" aria-label="Live network topology"><rect x="0" y="0" width="${W}" height="400" fill="var(--panel)"/>`;
  g+=`<rect x="10" y="8" width="${W-20}" height="34" rx="7" fill="var(--panel-2)" stroke="var(--line)"/><text x="20" y="30" font-size="12" font-weight="600" fill="var(--fg)">LAB-HOST</text><text x="${W-20}" y="30" font-size="10.5" text-anchor="end" fill="var(--muted)">${S.nat?'NAT → Internet':'no NAT'}${M(HOST).hostIps['HVLAB-Mgmt']?' · 10.10.0.1':''}</text>`;
  nets.forEach(([n,c,y])=>{const on=!!sw[n];g+=`<line x1="10" x2="${W-10}" y1="${y}" y2="${y}" stroke="${on?c:'var(--line)'}" stroke-width="${on?4:2}" stroke-dasharray="${on?'':'5 4'}" stroke-linecap="round"/><text x="12" y="${y-7}" font-size="10.5" font-weight="600" fill="${on?c:'var(--muted)'}">${n}${on?' · '+sw[n].type:' (not created)'}</text>`});
  if(sw['HVLAB-Mgmt']&&M(HOST).hostIps['HVLAB-Mgmt'])g+=`<line x1="40" x2="40" y1="42" y2="70" stroke="#0b62c4" stroke-width="2"/>`;
  vms.forEach((v,i)=>{const x=10+gap*i+gap/2,y=170,w=Math.min(60,gap-6);const up=v.state==='Running'&&(v.booted||!hasOS(v));
    v.nics.forEach(a=>{const net=nets.find(n=>n[0]===a.switch);if(!net)return;const m=S.machines[v.name];const off=m&&m.nicOff[ROLE_OF[a.switch]];g+=`<line x1="${x}" x2="${x}" y1="${net[2]}" y2="${net[2]<y?y-22:y+22}" stroke="${a.vlan||off?'var(--bad)':net[1]}" stroke-width="2" ${a.vlan||off?'stroke-dasharray="3 3"':''}/>`;if(a.vlan)g+=`<text x="${x+4}" y="${(net[2]+y)/2}" font-size="9.5" fill="var(--bad)">VLAN ${a.vlan}</text>`});
    g+=`<rect x="${x-w/2}" y="${y-22}" width="${w}" height="44" rx="7" fill="var(--panel)" stroke="${up?'var(--ok)':'var(--line)'}" stroke-width="${up?2:1}"/><text x="${x}" y="${y-3}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)">${esc(v.name.slice(0,8))}</text><text x="${x}" y="${y+12}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${PLAN[v.name]&&v.booted?PLAN[v.name].Mgmt.replace('10.10.',''):v.state}</text>`});
  if(!vms.length)g+=`<text x="${W/2}" y="175" text-anchor="middle" font-size="12" fill="var(--muted)">VMs appear here as you create them</text>`;
  if(S.cluster)g+=`<text x="${W/2}" y="250" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ok)">${S.cluster.name} · ${S.cluster.ip} · ${upNodes().length}/${Object.keys(S.cluster.nodes).length} nodes up</text>`;
  g+='</svg>';
  return `<div class="card"><h4>Live topology <small>solid = created, dashed red = VLAN or disabled NIC</small></h4>${g}</div>`;
}
function refresh(){renderRunbook();renderDetail();renderView();updatePrompt();save()}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}

/* ============================================================
   Console input, history, tab completion
   ============================================================ */
const hist=[];let hi=0;
$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('cmd').value;if(!v.trim())return;hist.push(v);hi=hist.length;$('cmd').value='';run(v)});
$('cmd').addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){if(hi>0){hi--;$('cmd').value=hist[hi]}e.preventDefault()}
  else if(e.key==='ArrowDown'){if(hi<hist.length-1){hi++;$('cmd').value=hist[hi]}else{hi=hist.length;$('cmd').value=''}e.preventDefault()}
  else if(e.key==='Tab'){const val=$('cmd').value;const m=val.match(/(^|\|\s*)([\w-]+)$/);if(m){const cand=[...new Set(Object.values(C).map(c=>c.name))].filter(n=>lc(n).startsWith(lc(m[2]))&&modAvailable(C[lc(n)].mod,ctxM())).sort();if(cand.length){$('cmd').value=val.slice(0,val.length-m[2].length)+cand[0];if(cand.length>1)toast(cand.slice(0,6).join('  '))}}e.preventDefault()}
});
$('clearBtn').onclick=()=>{out.innerHTML='';S.log=[];save()};
$('fastBtn').onclick=()=>{fast=!fast;$('fastBtn').textContent='Fast mode: '+(fast?'on':'off');$('fastBtn').setAttribute('aria-pressed',fast)};
$('resetBtn').onclick=()=>{$('resetWrap').innerHTML='<span class="confirm">Erase all progress? <button id="yesReset" class="danger">Reset</button><button id="noReset" class="ghost">Cancel</button></span>';$('yesReset').onclick=()=>{S=fresh();out.innerHTML='';welcome();restoreReset();refresh()};$('noReset').onclick=restoreReset};
function restoreReset(){$('resetWrap').innerHTML='<button id="resetBtn" class="ghost danger">Reset lab</button>';$('resetBtn').onclick=$('resetBtn').onclick||null;bindReset()}
function bindReset(){$('resetBtn').onclick=()=>{$('resetWrap').innerHTML='<span class="confirm">Erase all progress? <button id="yesReset" class="danger">Reset</button><button id="noReset" class="ghost">Cancel</button></span>';$('yesReset').onclick=()=>{S=fresh();out.innerHTML='';welcome();restoreReset();refresh()};$('noReset').onclick=restoreReset}}
bindReset();

function welcome(){
  print('Windows PowerShell\nCopyright (C) Microsoft Corporation. All rights reserved.\n','d');
  print('HVLAB Simulator: you are the administrator of LAB-HOST, a fresh Windows Server 2025 machine with 64 GB of RAM.','a');
  print('Your job: follow the runbook on the left to build a production-style Hyper-V environment, with a domain, a SAN, a two-node failover cluster and a DR site, then handle the incident tickets.\n','a');
  print('How it works\n  • Type real PowerShell here. Commands are checked against the state of your environment, so mistakes fail the way they would on real servers.\n  • Click a task for the why, a hint and the solution. Click any solution line to paste it, or let the simulator run it.\n  • Enter-PSSession -VMName <VM> connects to a VM; Exit-PSSession returns to the host.\n  • Golden images: C:\\Images\\WS2025-Core.vhdx and C:\\Images\\WS2025-Desktop.vhdx (generalized, with an answer file that names NICs after their switch and assigns the planned IPs).\n  • Type "help" for the supported cmdlets. Progress is saved in this browser.\n','d');
}
if(S.log&&S.log.length){S.log.forEach(([t,c])=>{const d=document.createElement('div');if(c)d.className=c;d.textContent=t;out.appendChild(d)});out.scrollTop=out.scrollHeight}else welcome();
// after reload no boot timers are pending: settle transient states
Object.values(S.vms).forEach(v=>{if(v.state==='Running'&&hasOS(v)&&!v.booted){v.booted=true;ensureGuest(v)}});
// sessions don't survive a reload
if(S.ctx!==HOST&&!machineUp(S.ctx))S.ctx=HOST;
checkTasks();refresh();
window.__sim={run,S:()=>S,ALLT,runSolution,taskDone,setFast:v=>{fast=v}};
</script>
